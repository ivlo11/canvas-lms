# Findings of script/api_docs_audit that stay as they are, each with its
# reason (design D6). An entry matches every finding whose fields equal all
# the keys the entry gives, so an entry without an action covers every action.
#
# Reasons:
#   internal           the field or response is internal and stays undocumented
#   unverifiable       no response shows it, only the code or the docs
#   notation           the documentation notation can't express it, such as a
#                      nullable model reference, keys that are ids or a
#                      response with no body
#   needs_description  added from responses, still without a description; a
#                      to-do list that never matches a finding
